name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes to prevent Render free tier sleep (15 min limit)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s https://bloggy-1-y7he.onrender.com/api/health
